services:
  smolvla-rpi:
    build:
      context: .
      platforms:
        - linux/arm64
    image: smolvla_rpi:dev
    platform: linux/arm64
    hostname: smolvla-rpi
    cpus: 4.0
    mem_limit: 8g
    memswap_limit: 8g
    volumes:
      - .:/workspace
      - ./models:/models
      - ${CPU_TEMP_PATH:-/dev/null}:/host_cpu_temp:ro
    environment:
      HF_HOME: /models/huggingface
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-30}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_zenoh_cpp}
      ZENOH_CONFIG_OVERRIDE: '${ZENOH_CONFIG_OVERRIDE:-mode="client";connect/endpoints=["tcp/172.16.101.221:7447"]}'
      ZENOH_ENDPOINT: ${ZENOH_ENDPOINT:-}
      ZENOH_KEY_PREFIX: ${ZENOH_KEY_PREFIX:-smolvla}
    working_dir: /workspace
    command: ["python", "/usr/local/bin/verify_lerobot.py"]

  smolvla-dev:
    build:
      context: .
      platforms:
        - linux/arm64
    image: smolvla_rpi:dev
    container_name: smolvla-dev
    platform: linux/arm64
    hostname: smolvla-dev
    cpus: 4.0
    mem_limit: 8g
    memswap_limit: 8g
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - .:/workspace
      - ./models:/models
      - ${CPU_TEMP_PATH:-/dev/null}:/host_cpu_temp:ro
    environment:
      HF_HOME: /models/huggingface
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-30}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_zenoh_cpp}
      ZENOH_CONFIG_OVERRIDE: '${ZENOH_CONFIG_OVERRIDE:-mode="client";connect/endpoints=["tcp/172.16.101.221:7447"]}'
      ZENOH_ENDPOINT: ${ZENOH_ENDPOINT:-}
      ZENOH_KEY_PREFIX: ${ZENOH_KEY_PREFIX:-smolvla}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /workspace
    command: ["python", "/workspace/web/server.py"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stdin_open: true
    tty: true
